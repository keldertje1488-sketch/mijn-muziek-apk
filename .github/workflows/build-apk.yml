name: Build and publish APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore complete project
        run: |
          curl -fL 'https://github.com/keldertje1488-sketch/mijn-muziek-apk/releases/download/v4.52/source.zip' -o source.zip
          unzip -q source.zip -d work
      - name: Build installable APK
        working-directory: work/Mijn_Muziek_Telefoon_PC_V4_52/android-project
        run: gradle :app:assembleDebug --no-daemon
      - name: Prepare downloads
        run: |
          mkdir -p release
          cp work/Mijn_Muziek_Telefoon_PC_V4_52/android-project/app/build/outputs/apk/debug/app-debug.apk release/Mijn_Muziek_V4_52_Google_Drive.apk
          cp source.zip release/Mijn_Muziek_Telefoon_PC_V4_52_COMPLEET.zip
          cp work/Mijn_Muziek_Telefoon_PC_V4_52/MIJN_MUZIEK_TELEFOON_PC_DIRECT_OPENEN.html release/Mijn_Muziek_V4_52_DIRECT_OPENEN.html
          cd release && sha256sum * > SHA256SUMS.txt
      - name: Publish public downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v4.52 >/dev/null 2>&1 || gh release create v4.52 --title 'Mijn Muziek V4.52' --notes 'Openbare Android APK met Google Drive-muziekmap, complete ZIP en direct-openen HTML.'
          gh release upload v4.52 release/* --clobber
